{{/* accept-invite is the Accept button for a pending invitation (an
     acceptForm): it accepts on the platform, then refreshes the program. */}}
{{define "accept-invite"}}<form class="accept-form" method="post" action="/invites/{{.Platform}}/{{.Handle}}/accept" data-busy="{{T "Accepting…"}}" data-stay-busy data-confirm="{{TF "Accept the invitation to %s on %s? HuntDeck accepts it there, then refreshes the program's scope and stats." .Name (platformLabel .Platform)}}"><input type="hidden" name="back" value="{{.Back}}"><button type="submit" class="small accept-btn" title="{{TF "Accept the invitation on %s, then refresh the program" (platformLabel .Platform)}}" aria-label="{{TF "Accept the invitation to %s" .Name}}"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span class="acc-label">{{T "Accept"}}</span></button></form>{{end}}
