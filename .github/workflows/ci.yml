name: ci

# Fast self-hosted CI on dev-tx-sh-app-01 (43.143.38.5) and automatic CD to 1.15.46.212.
# Heavy checks (-race, golangci-lint, govulncheck, shell gates) run on PRs and nightly in nightly.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit tests (emergency deploy only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://goproxy.cn|https://goproxy.io|direct
  GOTOOLCHAIN: auto
  PATH: /home/ubuntu/go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  check:
    if: ${{ inputs.skip_tests != true }}
    runs-on: [self-hosted, linux, x64, huntdeck-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain & vet
        run: |
          go version
          go vet ./...

      - name: tests (parallel)
        run: |
          set -euo pipefail
          other_pkgs=$(go list ./... | grep -v '/internal/web$')
          go test -timeout 10m $other_pkgs & p1=$!
          go test -timeout 10m -run '^Test[A-G]' ./internal/web & p2=$!
          go test -timeout 10m -run '^Test[H-P]' ./internal/web & p3=$!
          go test -timeout 10m -run '^Test[^A-P]' ./internal/web & p4=$!
          rc=0
          wait "$p1" || rc=1
          wait "$p2" || rc=1
          wait "$p3" || rc=1
          wait "$p4" || rc=1
          exit "$rc"

      - name: interface copy
        run: |
          out=$(python3 scripts/i18n-lint.py --count 2>&1)
          echo "$out"
          echo "$out" | grep -q "english left: 0"

  deploy:
    needs: [check]
    if: always() && (needs.check.result == 'success' || (needs.check.result == 'skipped' && inputs.skip_tests == true))
    runs-on: [self-hosted, linux, x64, huntdeck-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for idle polls on 1.15.46.212
        run: |
          for i in $(seq 1 18); do
            status_out=$(ssh -o BatchMode=yes -o ConnectTimeout=10 1.15.46.212 "cd /opt/huntdeck && sudo docker compose exec -T huntdeck /huntdeck status 2>/dev/null" || true)
            if printf '%s\n' "$status_out" | grep -q ' running '; then
              echo "Poll active on 1.15.46.212 (attempt $i/18), waiting 5s..."
              sleep 5
            else
              echo "No active poll running; proceeding with deploy."
              break
            fi
          done

      - name: Deploy to 1.15.46.212
        run: |
          git fetch --tags --force || true
          DEPLOY_VERSION="$(bash scripts/version.sh)"
          echo "DEPLOY_VERSION=$DEPLOY_VERSION" >> "$GITHUB_ENV"
          SKIP_TESTS=1 DEPLOY_VERSION="$DEPLOY_VERSION" bash scripts/deploy.sh --host 1.15.46.212 --mode binary

      - name: Verify live release & summary
        run: |
          check_out=$(bash scripts/deploy.sh --host 1.15.46.212 --check --expect "$DEPLOY_VERSION")
          echo "$check_out"
          {
            echo "### HuntDeck Deploy Summary"
            echo ""
            echo "- **Version**: \`$DEPLOY_VERSION\`"
            echo "- **Commit**: \`$GITHUB_SHA\`"
            echo ""
            echo '```'
            echo "$check_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
