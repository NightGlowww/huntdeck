name: ci

# Every check a change must pass, on a runner rather than only on a laptop:
# the local Makefile says the same things, but nothing enforced them before.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmtcheck

      - name: vet
        run: go vet ./...

      - name: tests (race)
        run: go test -race -timeout 20m ./...

      - name: interface copy
        run: python3 scripts/i18n-lint.py --count

      - name: lint
        # v2: .golangci.yml is written for it (version: "2").
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run

      - name: vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: container builds
        run: docker build -t huntdeck:ci .
